# Keep tmux's default prefix (Ctrl-b) and key bindings.

# Keep the names assigned by the workspace script.
set-window-option -g automatic-rename off
set-option -g allow-rename off

# Show the current workspace alongside tmux's window list.
set-option -g status-left '#[bold] #S #[default]'
set-option -g status-left-length 40
set-option -g status-right ''

# tmux advertises its own terminal type inside sessions; enable RGB when the
# outer terminal advertises the capability (as Ghostty does).
set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ',xterm-ghostty:RGB'

# Start zsh as a login shell, matching the WezTerm configuration.
set-option -g default-shell /bin/zsh
set-option -g default-command 'exec /bin/zsh -l'

# Focus events for apps like neovim
set -g focus-events on
